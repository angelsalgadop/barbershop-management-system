name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Make gradlew executable
      run: chmod +x android/gradlew

    - name: Build Release APK
      run: cd android && ./gradlew assembleRelease --no-daemon

    - name: Get Release APK info
      run: |
        echo "📦 APK Release generado:"
        ls -lh android/app/build/outputs/apk/release/app-release.apk
        echo "Tamaño: $(du -h android/app/build/outputs/apk/release/app-release.apk | cut -f1)"

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: BarbershopApp-release-${{ github.sha }}
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 30

    - name: Build Summary
      if: always()
      run: |
        echo "### 🎉 Build completado" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Actor:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
          echo "- ✅ **APK Release:** Listo para instalar (incluye bundle JS)" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 **Tamaño:** $(du -h android/app/build/outputs/apk/release/app-release.apk | cut -f1)" >> $GITHUB_STEP_SUMMARY
        fi
